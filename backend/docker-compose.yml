services:
  mongodb:
    image: mongo:7
    container_name: cinema_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cinema_booking

  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data: